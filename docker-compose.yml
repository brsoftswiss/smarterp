services:
  mariadb:
    image: mariadb:11.4
    container_name: smarterp-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: smarterp
      MARIADB_USER: smarterp
      MARIADB_PASSWORD: smarterp
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
